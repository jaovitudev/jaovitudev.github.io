<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jaovitudev - Portfólio & GitHub</title>
  <meta name="description" content="Página oficial de jaovitudev. Confira meus projetos, códigos e perfil no GitHub.">
  <meta name="google-site-verification" content="pwwVVpfRViMc1hbiNsJAi3KMfaqc9FrXRmTGc3iHpd0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: 3px solid #58a6ff;
      margin: 0 auto 20px auto;
      display: block;
      object-fit: cover;
      background-color: #21262d;
    }
    h1 {
      color: #ffffff;
      font-size: 28px;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #8b949e;
      margin-bottom: 28px;
    }
    p strong {
      color: #c9d1d9;
    }
    .btn {
      display: inline-block;
      background-color: #238636;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 13px 24px;
      border-radius: 8px;
      border: 1px solid rgba(240, 246, 252, 0.1);
      transition: background-color 0.2s ease, transform 0.1s ease;
      width: 100%;
    }
    .btn:hover {
      background-color: #2ea043;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <img 
      src="https://githubusercontent.com" 
      onerror="this.onerror=null; this.src='https://githubassets.com';"
      alt="jaovitudev" 
      class="avatar"
    >
    <h1>jaovitudev</h1>
    <p>Bem-vindo à página oficial de <strong>jaovitudev</strong>.</p>
    <a href="https://github.com" class="btn" target="_blank" rel="noopener noreferrer">
      Acesse meu perfil no GitHub
    </a>
  </main>
</body>
</html>
